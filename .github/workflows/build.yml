name: Build APK (Debug)

# Adapted from the upstream 2dust/v2rayNG build workflow (tag 2.3.11).
# Differences from upstream, per the Catly import task:
#   * Builds the Playstore DEBUG variant instead of a signed Release, so no
#     personal signing secrets are required or used.
#   * Runs the unit tests before assembling.
#   * Uploads the APKs as workflow artifacts only. It never creates or
#     overwrites a GitHub Release (the upstream sign-and-release job and the
#     keystore decoding step are removed).
#   * Workflow permissions are minimal (contents: read).
# Everything else (recursive submodule checkout, SDK/NDK versions, the HEV
# native build, and the libv2ray.aar download pinned to the exact tag that
# `git describe` reports for the checked-out AndroidLibXrayLite gitlink)
# is preserved from upstream.

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;30.0.16248370"
        echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "30.0.16248370"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-hevtun.sh

    - name: Save libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Copy libhevtun
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app
        ls -R ${{ github.workspace }}/V2rayNG/app/libs

    - name: Fetch AndroidLibXrayLite tag
      run: |
        pushd AndroidLibXrayLite
        CURRENT_TAG=$(git describe --tags --abbrev=0)
        echo "Current tag in this repo: $CURRENT_TAG"
        if [ -z "$CURRENT_TAG" ]; then
          echo "::error::Could not determine the AndroidLibXrayLite tag from the checked-out submodule revision; refusing to download an arbitrary libv2ray.aar release."
          exit 1
        fi
        echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
        popd

    - name: Download libv2ray
      uses: robinraju/release-downloader@v1.13
      with:
        repository: '2dust/AndroidLibXrayLite'
        tag: ${{ env.CURRENT_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    - name: Verify libv2ray.aar
      run: |
        if [ ! -s V2rayNG/app/libs/libv2ray.aar ]; then
          echo "::error::libv2ray.aar was not downloaded for AndroidLibXrayLite tag ${{ env.CURRENT_TAG }}."
          exit 1
        fi
        ls -lh V2rayNG/app/libs/libv2ray.aar

    - name: Setup Java
      uses: actions/setup-java@v6.1.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Run unit tests (Playstore Debug)
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew testPlaystoreDebugUnitTest --stacktrace

    - name: Assemble APK (Playstore Debug, no release signing)
      run: |
        cd ${{ github.workspace }}/V2rayNG
        ./gradlew assemblePlaystoreDebug --stacktrace

    - name: Upload Debug APKs
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      with:
        name: v2rayNG-playstore-debug-apks
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/playstore/debug/*.apk
        if-no-files-found: error
        retention-days: 90

    - name: Upload Gradle reports on failure
      uses: actions/upload-artifact@v7
      if: ${{ failure() }}
      with:
        name: gradle-reports
        path: |
          ${{ github.workspace }}/V2rayNG/app/build/reports/
          ${{ github.workspace }}/V2rayNG/app/build/test-results/
          ${{ github.workspace }}/V2rayNG/build/reports/
        if-no-files-found: ignore
        retention-days: 30
