name: Release (Signed)

# Signed Release build for V2rayNG-Catly.
# Manual trigger only (workflow_dispatch). Builds the Playstore RELEASE
# variant signed with the project release key, verifies the signature of
# every produced APK, uploads the APKs as a workflow artifact, and publishes
# them to a GitHub Release.
#
# Required repository secrets (already configured):
#   APP_KEYSTORE_BASE64    base64 of the release keystore (JKS)
#   APP_KEYSTORE_PASSWORD  keystore password
#   APP_KEYSTORE_ALIAS     key alias inside the keystore
#   APP_KEY_PASSWORD       key password
# The keystore itself is never committed to this repository.
#
# The setup steps (submodules, SDK/NDK, HEV native build, libv2ray.aar
# pinned to the AndroidLibXrayLite gitlink tag) are identical to
# .github/workflows/build.yml, which was adapted from upstream 2.3.11.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release tag to create or update'
        required: true
        type: string
        default: 'v2.3.11'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;30.0.16248370"
        echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "30.0.16248370"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-hevtun.sh

    - name: Save libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Copy libhevtun
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app
        ls -R ${{ github.workspace }}/V2rayNG/app/libs

    - name: Fetch AndroidLibXrayLite tag
      run: |
        pushd AndroidLibXrayLite
        CURRENT_TAG=$(git describe --tags --abbrev=0)
        echo "Current tag in this repo: $CURRENT_TAG"
        if [ -z "$CURRENT_TAG" ]; then
          echo "::error::Could not determine the AndroidLibXrayLite tag from the checked-out submodule revision; refusing to download an arbitrary libv2ray.aar release."
          exit 1
        fi
        echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
        popd

    - name: Download libv2ray
      uses: robinraju/release-downloader@v1.13
      with:
        repository: '2dust/AndroidLibXrayLite'
        tag: ${{ env.CURRENT_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    - name: Verify libv2ray.aar
      run: |
        if [ ! -s V2rayNG/app/libs/libv2ray.aar ]; then
          echo "::error::libv2ray.aar was not downloaded for AndroidLibXrayLite tag ${{ env.CURRENT_TAG }}."
          exit 1
        fi
        ls -lh V2rayNG/app/libs/libv2ray.aar

    - name: Setup Java
      uses: actions/setup-java@v6.2.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Run unit tests (Playstore Debug)
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew testPlaystoreDebugUnitTest --stacktrace

    - name: Decode release keystore
      env:
        KS_B64: ${{ secrets.APP_KEYSTORE_BASE64 }}
      run: |
        mkdir -p "$RUNNER_TEMP/signing"
        printf '%s' "$KS_B64" | base64 --decode > "$RUNNER_TEMP/signing/android_keystore.jks"
        if [ ! -s "$RUNNER_TEMP/signing/android_keystore.jks" ]; then
          echo "::error::Decoded keystore is empty; check the APP_KEYSTORE_BASE64 secret."
          exit 1
        fi
        ls -lh "$RUNNER_TEMP/signing/android_keystore.jks"

    - name: Assemble signed APK (Playstore Release)
      env:
        KS_STORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
        KS_ALIAS: ${{ secrets.APP_KEYSTORE_ALIAS }}
        KS_KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}
      run: |
        cd ${{ github.workspace }}/V2rayNG
        ./gradlew assemblePlaystoreRelease --stacktrace \
          -Pandroid.injected.signing.store.file="$RUNNER_TEMP/signing/android_keystore.jks" \
          -Pandroid.injected.signing.store.password="$KS_STORE_PASSWORD" \
          -Pandroid.injected.signing.key.alias="$KS_ALIAS" \
          -Pandroid.injected.signing.key.password="$KS_KEY_PASSWORD"

    - name: Verify APK signatures
      run: |
        APKSIGNER=$(ls ${ANDROID_HOME}/build-tools/*/apksigner | sort -V | tail -n 1)
        echo "Using apksigner: $APKSIGNER"
        for apk in ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/playstore/release/*.apk; do
          echo "--- $apk"
          "$APKSIGNER" verify "$apk"
        done
        "$APKSIGNER" verify --print-certs ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/playstore/release/*universal*.apk

    - name: Upload signed Release APKs
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      with:
        name: v2rayNG-playstore-release-signed-apks
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/playstore/release/*.apk
        if-no-files-found: error
        retention-days: 90

    - name: Publish GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ inputs.release_tag }}
      run: |
        cd ${{ github.workspace }}
        NOTES="Signed release build of V2rayNG-Catly 2.3.11 (upstream 2dust/v2rayNG 2.3.11 + Custom Location), Playstore flavor, signed with the project release key. Per-ABI and universal APKs attached. Built by the Release (Signed) workflow from commit ${{ github.sha }}."
        if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
          gh release upload "$RELEASE_TAG" V2rayNG/app/build/outputs/apk/playstore/release/*.apk --clobber
        else
          gh release create "$RELEASE_TAG" \
            --title "V2rayNG-Catly 2.3.11 (signed)" \
            --notes "$NOTES" \
            V2rayNG/app/build/outputs/apk/playstore/release/*.apk
        fi

    - name: Upload Gradle reports on failure
      uses: actions/upload-artifact@v7
      if: ${{ failure() }}
      with:
        name: gradle-reports-release
        path: |
          ${{ github.workspace }}/V2rayNG/app/build/reports/
          ${{ github.workspace }}/V2rayNG/app/build/test-results/
          ${{ github.workspace }}/V2rayNG/build/reports/
        if-no-files-found: ignore
        retention-days: 30
